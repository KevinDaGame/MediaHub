version: '3.4'

services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: mediahub
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db_data:/var/lib/mysql
  mediahub.api:
    build:
        context: .
        dockerfile: ./MediaHub.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - MYSQL_CONNECTION_STRING=server=db;port=3306;database=mediahub;user=root;password=example;sslmode=none;
    volumes:
      - C:\Users\kevin\RiderProjects\MediaHub\MediaHub.API\media:/app/media
      - C:\Users\kevin\RiderProjects\MediaHub\MediaHub.API\thumbnails:/app/thumbnails
    depends_on:
      - db
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - ~/external-drive/torrent/config:/config
      - ~/external-drive/mediahub:/downloads
    restart: unless-stopped
    network_mode: service:surfshark
    depends_on:
      - surfshark
  surfshark:
    image: ilteoood/docker-surfshark
    container_name: surfshark
    environment:
      - SURFSHARK_USER=hWtMYJSXGySMWP8UKz46Ts6a
      - SURFSHARK_PASSWORD=n6LJHMH54P9KdA5nZ9CQXVrt
      - SURFSHARK_COUNTRY=nl
      - SURFSHARK_CITY=ams
      - CONNECTION_TYPE=udp
      - LAN_NETWORK=
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - 1080:1080 #if you want to use the socks5 server
      - 9091:9091 #we open here the port for transmission, as this container will be the access point for the others
      - 5002:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    dns:
      - 1.1.1.1          
volumes:
  db_data: